# DiscoverMake CI: the gate every change to main must pass.
#   web     typecheck, lint (zero warnings), vitest against Postgres 16, production build
#   worker  the CAD worker's pytest, with the real SolidCraft engine (release binary, sha256-checked)
#   e2e     the release gate (a full real order), smoke, and both "Make it in 3D" journeys at 390 + 1280 px
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLIDCRAFT_VERSION: "0.48.1"
  SOLIDCRAFT_SHA256: 0781bd71de0a67a4bf98ad9e2cc8aa5248d3b6e7db2b7f1dfae7f426555d8b67

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dm, POSTGRES_PASSWORD: dm, POSTGRES_DB: discovermake }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dm:dm@localhost:5432/discovermake
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Production build
        run: bun run build
        env:
          NODE_ENV: production

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/cad-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - name: SolidCraft engine (the release the Dockerfile pins)
        run: |
          f="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL "https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}/${f}" -o "/tmp/${f}"
          echo "${SOLIDCRAFT_SHA256}  /tmp/${f}" | sha256sum -c -
          tar -xzf "/tmp/${f}" -C /tmp
          sudo install -m 0755 "/tmp/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli" /usr/local/bin/solidcraft-cli
          SOLIDCRAFT_NO_TELEMETRY=1 DO_NOT_TRACK=1 SOLIDCRAFT_UPDATE_CHECK=0 solidcraft-cli --version
      - name: pytest (real SolidCraft builds included)
        run: python -m pytest -q
        env:
          SOLIDCRAFT_CLI: /usr/local/bin/solidcraft-cli

  e2e:
    # Pinned: Playwright's browser builds do not support ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dm, POSTGRES_PASSWORD: dm, POSTGRES_DB: discovermake }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dm" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Release gate, smoke and Make it in 3D journeys
        run: bunx playwright test tests/e2e/order.spec.ts tests/e2e/smoke.spec.ts tests/e2e/text-to-cad-journey.spec.ts tests/e2e/solidcraft-sizes-journey.spec.ts --project=chromium
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: test-results, retention-days: 7 }
