[project]
name = "discovermake-cad-worker"
version = "0.3.0"
description = "DiscoverMake CAD worker: structured CadSpec -> CadQuery -> STEP / DXF flat pattern / GLB (R2, EPIC-100-4)"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
    "cadquery==2.8.*",   # Apache-2.0; pulls OCP (LGPL-2.1, unmodified wheel) and ezdxf (MIT)
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["cad_worker*"]

[tool.setuptools.package-data]
# Kid templates and the measure script are run by the cadgen interpreter, not imported here.
"cad_worker.text_to_cad" = ["*.py"]
"cad_worker.text_to_cad.templates" = ["*.py", "*.ttf", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
